name: Publish

# The only publication path: publishing a GitHub Release whose tag is vMAJOR.MINOR.PATCH
# (optionally with a prerelease suffix, e.g. v0.2.0-alpha.1). A failed run can be
# retried with "Re-run jobs" on the same release.
on:
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

# One publication per release tag at a time; never cancel a publication midway.
concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Derive Maven version from release tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$TAG" =~ $semver ]]; then
            echo "::error::Release tag '$TAG' is not of the form vMAJOR.MINOR.PATCH[-PRERELEASE] (e.g. v0.1.0, v0.2.0-alpha.1)."
            exit 1
          fi
          if [[ "$TAG" == *SNAPSHOT* ]]; then
            echo "::error::Release tag '$TAG' must not be a SNAPSHOT version."
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Publishing version ${TAG#v} from tag $TAG"

      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Show Gradle and JVM versions
        run: ./gradlew --version

      # Full verification first. If any test fails, the job stops here and
      # nothing is published. --no-build-cache forces the tests to execute.
      - name: Build and test
        env:
          ORG_GRADLE_PROJECT_version: ${{ steps.version.outputs.version }}
        run: ./gradlew clean build --no-build-cache

      - name: Publish to GitHub Packages
        env:
          ORG_GRADLE_PROJECT_version: ${{ steps.version.outputs.version }}
          ORG_GRADLE_PROJECT_GitHubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_GitHubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository
