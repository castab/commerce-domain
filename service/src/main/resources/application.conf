# commerce-service runtime defaults. Every value can be overridden through the
# environment variables documented on CommerceServiceConfiguration; secrets are
# supplied only that way and never committed.

server {
  port = 8080
}

database {
  jdbcUrl = ""
  username = ""
  password = ""
  maximumPoolSize = 4
  minimumIdle = 1
  connectionTimeoutMs = 500
  validationTimeoutMs = 1000
}

flyway {
  enabled = false
}
